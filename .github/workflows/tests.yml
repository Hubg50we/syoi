name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: supoclip
          POSTGRES_USER: supoclip
          POSTGRES_PASSWORD: supoclip_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supoclip -d supoclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      TEST_DATABASE_URL: postgresql+asyncpg://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SELF_HOST: "true"
      BACKEND_AUTH_SECRET: supoclip_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install backend dependencies
        run: cd backend && uv sync --frozen --all-groups
        continue-on-error: true
      - name: Run backend tests
        run: cd backend && .venv/bin/pytest tests/unit --no-cov
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SELF_HOST: "true"
      BACKEND_AUTH_SECRET: supoclip_test_secret
      BETTER_AUTH_SECRET: supoclip_better_auth_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile
        continue-on-error: true
      - name: Lint and type-check frontend
        run: cd frontend && pnpm run lint && pnpm run typecheck
        continue-on-error: true
      - name: Run frontend unit tests
        run: cd frontend && pnpm run test:coverage
        continue-on-error: true

  e2e:
    runs-on: ubuntu-24.04
    needs:
      - backend
      - frontend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: supoclip
          POSTGRES_USER: supoclip
          POSTGRES_PASSWORD: supoclip_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supoclip -d supoclip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      TEST_DATABASE_URL: postgresql+asyncpg://supoclip:supoclip_password@127.0.0.1:5432/supoclip
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      NEXT_PUBLIC_SELF_HOST: "true"
      BACKEND_AUTH_SECRET: supoclip_test_secret
      BETTER_AUTH_SECRET: supoclip_better_auth_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: cd backend && uv sync --frozen --all-groups
        continue-on-error: true
      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile
        continue-on-error: true
      - name: Install Playwright browsers
        run: cd frontend && pnpm exec playwright install --with-deps
        continue-on-error: true
      - name: Run Playwright smoke tests
        run: cd frontend && pnpm run test:e2e
        continue-on-error: true
